name: Mobile Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🚨 CRITICAL: Fix KVM permissions for hardware acceleration
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 3️⃣ Setup Node.js, Appium & FFmpeg
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Appium & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install -g appium
          appium driver install uiautomator2

      # 4️⃣ Run Android Tests on Emulator
      - name: Run Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # Start Appium in background
            appium --log-level debug > appium.log 2>&1 &
            
            # Wait for Appium to be ready
            echo "Waiting for Appium to start..."
            timeout 60s bash -c 'until curl -s http://localhost:4723/status; do sleep 2; done'
            echo "Appium is UP and running!"
            
            # Grant execute permission and run tests
            chmod +x gradlew
            ./gradlew clean test -Dplatform=android || echo "Tests failed but continuing to report..."
            
            # 🚨 Kill Appium (safely)
            echo "Stopping Appium server..."
            pkill -x appium || true
            sleep 2

      # 5️⃣ Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: ./gradlew allureReport

      # 6️⃣ Upload Allure HTML Report - Artifact
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport

      # 7️⃣ Upload Allure Results (Raw) - Artifact
      - name: Upload Allure Results (Raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results

      # 8️⃣ Deploy Allure Report to GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/reports/allure-report/allureReport # 🚀 Correct subfolder
          force_orphan: true

      # 9️⃣ Send Telegram Notification
      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "🚨 Telegram secrets are missing! Skipping notification."
            exit 0
          fi

          TEXT="🚀 *Mobile Test Execution Completed!*
          
          ✅ *Result:* ${{ job.status }}
          🌍 *Report:* [Click here to view](https://abhi9avx.github.io/modular-mobile-automation-framework/)
          
          🛠 *Platform:* Android (API 28)"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$TEXT" \
            -d parse_mode="Markdown"
