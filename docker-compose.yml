# Multi-service mobile automation setup
version: '3.8'

services:
  # 🤖 Service 1: The Android Emulator (Infrastructure)
  android-device:
    image: budtmo/docker-android:emulator-11.0
    privileged: true
    ports:
      - "4723:4723" # Appium
      - "6080:6080" # VNC Viewer (Watch simulations in browser)
    environment:
      - DEVICE=Samsung Galaxy S10
      - APPIUM=true
    networks:
      - automation-network

  # 🧪 Service 2: The Test Engine
  mobile-tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - android-device
    environment:
      - platform=android
      # Use the container name as the host
      - appiumServerUrl=http://android-device:4723/wd/hub
    volumes:
      # Map results to host machine so you can view them locally after container dies
      - ./build/allure-results:/app/build/allure-results
      - ./build/reports:/app/build/reports
      - ./build/logs:/app/build/logs
    networks:
      - automation-network

networks:
  automation-network:
    driver: bridge
