plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.abhinav.mobile'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.10.2'
    implementation 'io.appium:java-client:9.4.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'

     // Allure Reporting
    testImplementation 'io.qameta.allure:allure-testng:2.29.0' 
}

allure {
    version = '2.29.0'
}

spotless {
    java {
        googleJavaFormat()  // Google Java style
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        target 'src/**/*.java'
    }
}

test {
    useTestNG()
    
    // Automatically clear old Allure results before every test run
    doFirst {
        delete fileTree("build/allure-results")
    }

    // pass specific system properties to the test runner
    systemProperty "platform", System.getProperty("platform")

    // Allure results directory
    systemProperty "allure.results.directory", "build/allure-results"
}
